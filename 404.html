<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<script>
  // GitHub Pages is case-sensitive: /myfth/ , /myFTH/ , /MYFTH/ ... -> /MyFTH/ (keeps ?query and #hash)
  (function () {
    var m = /^\/myfth(\/.*)?$/i.exec(location.pathname);
    if (m && location.pathname.indexOf('/MyFTH') !== 0) location.replace('/MyFTH' + (m[1] || '/') + location.search + location.hash);
  })();
</script>
<style>body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#f3f3f5;color:#1b1b1f;text-align:center}h1{font-size:28px;margin:0 0 8px}a{color:#C32C30;font-weight:600}</style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>The page you opened does not exist. <a href="/">Back to the FANUC Thai links page</a></p>
  </div>
</body>
</html>
