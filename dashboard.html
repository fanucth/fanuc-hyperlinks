<title>FTH Survey Dashboard</title>
<!-- FTH Service Quality & CS Evaluation — Exec Dashboard
     VERSION: ดู APP_VERSION ในสคริปต์ (มุมขวาล่าง + console) — bump ทุกครั้งก่อนอัปขึ้น GitHub
     ผู้บริหารเท่านั้น (อีเมลใน EXEC_ALLOWLIST + ตาราง exec_allowlist / RLS is_exec())
     ข้อมูลจาก view v_survey_full (ดู SUPABASE_SETUP.sql)
     UI: FANUC Web UI Kit (fanuc-ui.css) — ต้องอัป fanuc-ui.css ขึ้น repo คู่กัน

     CHANGELOG:
       2026.09.15b - popup โปรไฟล์วิศวกร: เพิ่มแสดงอีเมล คลิกแล้วเปิดส่งเมลได้เลย (mailto:);
                     ตาราง All responses เพิ่มปุ่ม "ตอบกลับ" (✉️) ต่อแถว เปิดอีเมลถึงวิศวกรคนนั้นพร้อมแนบ
                     รายละเอียดงาน (วันที่, ลูกค้า, Report/Order No., ทีมงาน, คะแนน Q1-Q5, ความเห็นลูกค้า) อัตโนมัติ
       2026.09.15a - popup โปรไฟล์วิศวกร: รูปใหญ่ขึ้น (76px -> 140px); คะแนนเฉลี่ย (ตารางอันดับ, KPI ผู้นำ,
                     KPI เฉลี่ยรวม, popup โปรไฟล์) โชว์เป็นดาว 5 ดวงเติมสีตามสัดส่วนจริงคู่กับตัวเลข
       2026.09.11a - เพิ่มคอลัมน์ Customer / Email(+badge ส่งแล้ว) / Team ในตาราง All responses + Excel export  [ต้องรัน migrate_batch2.sql สำหรับ Customer/Team];
                     หัวคอลัมน์ Q3 เปลี่ยนเป็น "Explanation" (เดิม Communication/Cost) ตาม feedback หัวหน้า + หมายเหตุใต้ตารางบอกวันที่เปลี่ยนคำถาม;
                     คลิกชื่อวิศวกร (ตาราง All responses / อันดับ) เปิดโปรไฟล์: รูป/ตำแหน่ง/แผนก/เบอร์/อายุงาน/สถิติ;
                     อันดับ + KPI ผู้นำ อ่านจาก v_survey_by_engineer (นับงานทีมให้ทุกคนเท่ากัน)  [ต้องรัน migrate_batch2.sql];
                     ปุ่มกรองด่วน เพิ่ม วันนี้ / เมื่อวาน / สัปดาห์นี้
       2026.09.10l - All responses: เลขหน้าแบบเต็ม (หน้าแรก/สุดท้าย + ปุ่มเลขหน้า 1..N + ช่องพิมพ์เลขไปหน้านั้น) แทน Prev/Next อย่างเดียว
       2026.09.10k -หน้า login มี "ลืมรหัสผ่าน?" (ส่งลิงก์ตั้งรหัสใหม่ทางอีเมล); หลัง login มีปุ่ม "เปลี่ยนรหัสผ่าน" บน app bar
       2026.09.10j - หัวตารางเข้มขึ้น (ทุกตาราง); คลิกหัวคอลัมน์ = เรียง asc/desc (▲▼); ปุ่ม Export แยกที่การ์ด
                     "อันดับคะแนน" และ "รายการทั้งหมด" (นอกจาก Export ทั้งหมด); hover แถว = พื้นอุ่น + แถบซ้ายสีแบรนด์
       2026.09.10i - ตัวกรองแถวเดียวกระชับ; "อันดับคะแนนของวิศวกร"; Report/Order หัวคอลัมน์ 2 บรรทัด (Service / Report No.);
                     Comm/Cost -> Communication/Cost; หัวตารางมีพื้นหลัง (--fc-th-bg) ต่างจากแถวข้อมูล
       2026.09.10h - เพิ่มคอลัมน์ IP ลูกค้า (เก็บฝั่ง server ตอน submit จาก cf-connecting-ip) + client_ua ใน export  [ต้องรัน migrate_client_ip.sql]
       2026.09.10g - ชื่อบริษัท = Fanuc Thai Limited.; ปุ่มเปิด/ปิดเก็บพิกัดย้ายขึ้น app bar (เอาการ์ดตั้งค่าออก);
                     KPI ใหม่ 6 การ์ด (คะแนน/จำนวน สูงสุด เดือนนี้+เดือนก่อน, ไม่ขึ้นกับตัวกรอง);
                     ตาราง: เส้นแนวตั้ง + ไฮไลต์แถวตอนชี้เมาส์; อันดับ/Q จัดกึ่งกลาง; แยก Report/Order เป็น 2 คอลัมน์กึ่งกลาง;
                     Sig -> Signature + ปุ่มดูใหญ่ขึ้น; แก้ "Overall" ซ้ำ (คอลัมน์เฉลี่ย = Average)
       2026.09.10f - เต็มจอ + โลโก้ FANUC มุมซ้าย; All responses: หน้าละ 10 (ปรับได้ 10/25/50/100) + Prev/Next,
                     เพิ่มคอลัมน์แผนก, รวม Report/Order เป็นคอลัมน์เดียว 2 บรรทัด; filter เพิ่ม "เดือนก่อน";
                     Location แสดงอำเภอ/จังหวัด (geo_area); watermark ลายเซ็นอ่านออก + ใส่ RP/SO  [ต้องรัน migrate_geo_area.sql]
       2026.09.10e - fix: Sign out ค้าง (signOut scope:'local' + try/catch) -> ไป survey.html?loggedout=1 ชัวร์
       2026.09.10d - กด Sign out -> กลับไป survey.html (ประตูทางเข้าเดียว)
       2026.09.10c - ตาราง All responses: หัวตาราง sticky (ล็อกไว้), ลากปรับกว้างคอลัมน์ได้ (จำค่า),
                     ช่อง comment กว้างขึ้น, คอลัมน์วันที่แยกเป็น 2 บรรทัด (วันที่ / เวลา)
       2026.09.10b - ดูลายเซ็นลูกค้า: ใส่ลายน้ำ "ห้ามเผยแพร่" + อีเมลผู้เปิด + เวลา (กันเอาภาพไปใช้ต่อ)
       2026.09.10a - รื้อ UI ใหม่ตาม FANUC Web UI Kit (fanuc-ui.css): app bar, KPI, badge, ตารางมาตรฐาน,
                     light/dark toggle, skeleton, empty state
       2026.09.09c - filter แผนก + ปุ่มลัด เดือนนี้/ปีนี้ + อันดับช่าง (🥇🥈🥉) + ขั้นต่ำรายการ; "All" ภาษาอังกฤษ
       2026.09.09b - สวิตช์ "เก็บพิกัดตอนช่างสร้าง QR" (exec เปิด/ปิด) + คอลัมน์ 📍 + export  [ต้องรัน migrate_geo.sql]
       2026.09.09a - เวอร์ชันแรก: login exec, filter วันที่/ช่าง, สรุปรายช่าง, ตารางรายการ, export Excel (2 sheet)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fanuc-ui.css">
<style>
  /* เฉพาะหน้านี้ — ประกอบจากโทเก้น .fc ไม่มี hex */
  #appVer{position:fixed;right:var(--fc-s2);bottom:var(--fc-s1);font-size:12px;color:var(--fc-text-mute);opacity:.7;pointer-events:none;user-select:none;z-index:5;}
  .fc-container{max-width:none;padding:var(--fc-s4) var(--fc-s5);}   /* dashboard = เต็มจอ */
  .appbar-logo{height:26px;width:auto;display:block;}
  .toggle-geo{display:flex;align-items:center;gap:var(--fc-s3);cursor:pointer;font-size:16px;}
  .toggle-geo input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--fc-primary);}
  .medal{font-size:16px;}
  .geo-switch{display:flex;align-items:center;gap:var(--fc-s2);font-size:13px;color:var(--fc-text-dim);
    border:1px solid var(--fc-border-strong);border-radius:var(--fc-radius);padding:5px 10px;min-height:36px;cursor:pointer;white-space:nowrap;}
  .geo-switch input{width:16px;height:16px;margin:0;accent-color:var(--fc-primary);}
  .kpi-name{font-family:var(--fc-font-head);font-weight:600;font-size:20px;line-height:1.35;}
  /* แถบตัวกรองแบบกระชับ (แถวเดียวบนจอกว้าง) */
  .fc-card--tight{padding:var(--fc-s3) var(--fc-s4);}
  .filters-bar{display:flex;flex-wrap:wrap;gap:var(--fc-s2);align-items:flex-end;}
  .filters-bar .fc-field{margin:0;}
  .filters-bar .fc-field__label{font-size:11px;margin-bottom:2px;}
  .filters-bar .fc-input,.filters-bar .fc-select{min-height:32px;padding:5px 8px;font-size:13px;}
  .filters-bar .f-date{width:132px;} .filters-bar .f-sel{width:150px;} .filters-bar .f-min{width:64px;text-align:center;}
  .filters-bar .fc-btn{min-height:32px;padding:6px 12px;font-size:13px;}
  .filters-bar .qbtns{display:flex;gap:4px;align-self:flex-end;}
  .login-wrap{max-width:380px;margin:var(--fc-s6) auto 0;}
  a.geo-link,a.sig-link{color:var(--fc-primary);text-decoration:none;font-size:12px;}
  a.geo-link{font-family:var(--fc-font-body);}
  .pager{display:flex;align-items:center;gap:var(--fc-s2);flex-wrap:wrap;margin-top:var(--fc-s3);font-size:14px;color:var(--fc-text-dim);}
  .pager .fc-select{width:auto;min-height:32px;padding:4px 8px;font-size:13px;}
  .pager .pg-nums{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .pager .pg-num{min-width:32px;min-height:32px;padding:4px 8px;border:1px solid var(--fc-border);border-radius:var(--fc-radius);
    background:var(--fc-surface);color:var(--fc-text);font:inherit;font-size:13px;cursor:pointer;text-align:center;}
  .pager .pg-num:hover:not(.on){background:var(--fc-row-hover);}
  .pager .pg-num.on{background:var(--fc-primary);border-color:var(--fc-primary);color:#fff;font-weight:700;cursor:default;}
  .pager .pg-gap{padding:0 2px;color:var(--fc-text-mute);}
  .pager .pg-jump{width:56px;min-height:32px;padding:4px 6px;font-size:13px;text-align:center;}
  .eng-link{color:var(--fc-primary);text-decoration:none;cursor:pointer;}
  .eng-link:hover{text-decoration:underline;}
  .ep-head{display:flex;align-items:center;gap:var(--fc-s4);margin-bottom:var(--fc-s4);}
  .ep-photo{width:140px;height:140px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--fc-zebra);border:2px solid var(--fc-border);}
  .ep-head{flex-wrap:wrap;}
  .ep-name{font-family:var(--fc-font-head);font-weight:600;font-size:18px;}
  .ep-meta{font-size:13px;color:var(--fc-text-dim);line-height:1.7;}
  .ep-meta a{color:var(--fc-primary);text-decoration:none;}
  .ep-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--fc-s2);margin-bottom:var(--fc-s3);}
  .ep-stat{border:1px solid var(--fc-border);border-radius:var(--fc-radius);padding:var(--fc-s2) var(--fc-s3);}
  .ep-stat .v{font-family:var(--fc-font-head);font-size:20px;font-weight:600;}
  .ep-stat .l{font-size:12px;color:var(--fc-text-mute);}
  .ep-bar-row{display:flex;align-items:center;gap:var(--fc-s2);font-size:12.5px;margin-bottom:6px;}
  .ep-bar-row .lbl{width:72px;flex:0 0 auto;color:var(--fc-text-dim);}
  .ep-bar-track{flex:1;height:8px;border-radius:4px;background:var(--fc-zebra);overflow:hidden;}
  .ep-bar-fill{height:100%;background:var(--fc-primary);}
  .ep-bar-val{width:30px;flex:0 0 auto;text-align:right;font-family:var(--fc-font-mono);}
  .ep-comment{border-left:3px solid var(--fc-border-strong);padding:4px 0 4px var(--fc-s2);margin-bottom:var(--fc-s2);font-size:13px;color:var(--fc-text-dim);}
  .stars{display:inline-flex;gap:1px;font-size:14px;line-height:1;vertical-align:middle;}
  .star{position:relative;display:inline-block;color:var(--fc-border-strong);}
  .star::before{content:"★";position:absolute;inset:0;width:var(--p);overflow:hidden;color:var(--fc-accent);white-space:nowrap;}
  .ep-stat .stars{font-size:18px;}
</style>
</head>
<body class="fc">
<header class="fc-appbar">
  <img class="appbar-logo" src="fanuc-logo.png" alt="FANUC" onerror="this.style.display='none'">
  <div class="fc-appbar__brand">
    <h1 class="fc-appbar__title" data-i18n="appTitle">Fanuc Thai Limited. — แดชบอร์ดผลสำรวจ</h1>
    <span class="fc-appbar__sub" data-i18n="appSub">ผลสำรวจความพึงพอใจลูกค้า — สำหรับผู้บริหาร</span>
  </div>
  <div class="fc-appbar__spacer"></div>
  <div class="fc-appbar__actions">
    <select id="langSelect" class="fc-select" style="width:auto;min-height:36px;padding:6px 10px;font-size:14px" title="Language">
      <option value="th">ไทย</option><option value="en">EN</option><option value="ja">日本語</option>
    </select>
    <label class="geo-switch fc-hidden" id="geoSwitch" title="">
      <input type="checkbox" id="setGeo">
      <span>📍 <span data-i18n="geoToggle">เก็บพิกัด</span></span>
    </label>
    <button id="btnTheme" class="fc-btn fc-btn--ghost fc-btn--icon" title="Theme" aria-label="Toggle theme">🌙</button>
    <button id="btnChgPw" class="fc-btn fc-btn--ghost fc-btn--sm fc-hidden" data-i18n="changePw">เปลี่ยนรหัสผ่าน</button>
    <button id="btnLogout" class="fc-btn fc-btn--ghost fc-hidden" data-i18n="logout">ออกจากระบบ</button>
  </div>
</header>

<main class="fc-container">
  <div id="cfgBanner" class="fc-card fc-hidden" style="border-color:var(--fc-danger)"></div>

  <!-- LOGIN -->
  <section id="viewLogin" class="fc-hidden">
    <div class="fc-card login-wrap">
      <div class="fc-card__head"><h2 class="fc-card__title" data-i18n="signIn">เข้าสู่ระบบ</h2></div>
      <label class="fc-field">
        <span class="fc-field__label" data-i18n="email">อีเมล</span>
        <input type="email" id="loginEmail" class="fc-input" autocomplete="username">
      </label>
      <label class="fc-field">
        <span class="fc-field__label" data-i18n="password">รหัสผ่าน</span>
        <input type="password" id="loginPass" class="fc-input" autocomplete="current-password">
      </label>
      <button class="fc-btn fc-btn--primary" id="btnLogin" style="width:100%" data-i18n="signIn">เข้าสู่ระบบ</button>
      <p style="text-align:center;margin:var(--fc-s2) 0 0"><a href="#" id="linkForgot" style="font-size:12.5px" data-i18n="forgotPw">ลืมรหัสผ่าน?</a></p>
      <p class="fc-note" style="margin-top:var(--fc-s3)" data-i18n="execOnly">เฉพาะผู้บริหารที่ได้รับสิทธิ์เท่านั้น</p>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="viewDash" class="fc-hidden">

    <div class="fc-kpis" id="kpis" style="margin-bottom:var(--fc-s4)"></div>

    <div class="fc-card fc-card--tight">
      <div class="filters-bar">
        <div class="qbtns">
          <button class="fc-btn fc-btn--sm" id="qToday" data-i18n="today">วันนี้</button>
          <button class="fc-btn fc-btn--sm" id="qYesterday" data-i18n="yesterday">เมื่อวาน</button>
          <button class="fc-btn fc-btn--sm" id="qThisWeek" data-i18n="thisWeek">สัปดาห์นี้</button>
          <button class="fc-btn fc-btn--sm" id="qMonth" data-i18n="thisMonth">เดือนนี้</button>
          <button class="fc-btn fc-btn--sm" id="qLastMonth" data-i18n="lastMonth">เดือนก่อน</button>
          <button class="fc-btn fc-btn--sm" id="qYear" data-i18n="thisYear">ปีนี้</button>
          <button class="fc-btn fc-btn--sm" id="qAll" data-i18n="allTime">ทั้งหมด</button>
        </div>
        <label class="fc-field"><span class="fc-field__label" data-i18n="dateFrom">ตั้งแต่วันที่</span>
          <input type="date" id="fFrom" class="fc-input f-date"></label>
        <label class="fc-field"><span class="fc-field__label" data-i18n="dateTo">ถึงวันที่</span>
          <input type="date" id="fTo" class="fc-input f-date"></label>
        <label class="fc-field"><span class="fc-field__label" data-i18n="filterDept">แผนก</span>
          <select id="fDept" class="fc-select f-sel"><option value="">— All —</option></select></label>
        <label class="fc-field"><span class="fc-field__label" data-i18n="filterEngineer">วิศวกร</span>
          <select id="fEngineer" class="fc-select f-sel"><option value="">— All —</option></select></label>
        <label class="fc-field"><span class="fc-field__label" data-i18n="minN">ขั้นต่ำ</span>
          <input type="number" id="fMinN" class="fc-input f-min" value="1" min="1"></label>
        <button class="fc-btn fc-btn--primary" id="btnApply" data-i18n="apply">แสดงผล</button>
        <button class="fc-btn" id="btnExport" data-i18n="exportXlsx">Export Excel</button>
      </div>
    </div>

    <div class="fc-card">
      <div class="fc-card__head">
        <h2 class="fc-card__title" data-i18n="ranking">อันดับรายช่าง</h2>
        <span class="fc-mut" id="rankNote"></span>
        <button class="fc-btn fc-btn--sm fc-right" id="btnExportRank" data-i18n="exportBtn">Export</button>
      </div>
      <div id="sumBox" class="fc-table-wrap"><table class="fc-table fc-table--zebra" id="sumTable"></table></div>
    </div>

    <div class="fc-card">
      <div class="fc-card__head">
        <h2 class="fc-card__title" data-i18n="detail">รายการทั้งหมด</h2>
        <span class="fc-mut" id="detCount"></span>
        <button class="fc-btn fc-btn--sm fc-right" id="btnExportDet" data-i18n="exportBtn">Export</button>
      </div>
      <div id="detBox" class="fc-table-wrap fc-table-wrap--tall"><table class="fc-table fc-table--zebra" id="detTable"></table></div>
      <div class="pager" id="pager"></div>
      <p class="fc-note" style="margin-top:var(--fc-s2)" data-i18n="q3WordingNote"></p>
    </div>
  </section>
</main>

<div id="appVer"></div>
<div id="toast" class="fc-toast"></div>

<div id="engModal" class="fc-modal fc-hidden">
  <div class="fc-modal__box" style="max-width:520px">
    <h3 data-i18n="engProfile">ข้อมูลวิศวกร</h3>
    <div id="engModalBody"></div>
    <div class="fc-row" style="gap:var(--fc-s2);margin-top:var(--fc-s3)">
      <button class="fc-btn" id="engModalClose" style="flex:1" data-i18n="close">ปิด</button>
    </div>
  </div>
</div>

<div id="pwModal" class="fc-modal fc-hidden">
  <div class="fc-modal__box">
    <h3 id="pwTitle" data-i18n="changePw">เปลี่ยนรหัสผ่าน</h3>
    <label class="fc-field"><span class="fc-field__label" data-i18n="pwNew">รหัสผ่านใหม่</span>
      <input type="password" id="pwNew" class="fc-input" autocomplete="new-password"></label>
    <label class="fc-field"><span class="fc-field__label" data-i18n="pwNew2">ยืนยันรหัสผ่านใหม่</span>
      <input type="password" id="pwNew2" class="fc-input" autocomplete="new-password"></label>
    <p id="pwErr" class="fc-field__error" style="min-height:16px"></p>
    <div class="fc-row" style="gap:var(--fc-s2)">
      <button class="fc-btn" id="pwCancel" style="flex:1" data-i18n="cancel">ยกเลิก</button>
      <button class="fc-btn fc-btn--primary" id="pwSave" style="flex:1" data-i18n="save">บันทึก</button>
    </div>

let lang = localStorage.getItem('dashLang') || 'th';
function t(key, vars){
  let s = (I18N[key] && (I18N[key][lang] || I18N[key].th)) || key;
  if (vars) for (const k in vars) s = s.replace(`{${k}}`, vars[k]);
  return s;
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.documentElement.lang = lang;
}

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateTime(iso){
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtD(iso){ if (!iso) return ''; const d=new Date(iso),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function fmtT(iso){ if (!iso) return ''; const d=new Date(iso),p=n=>String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}`; }

// ล็อกหัวตาราง + ให้ผู้ใช้ลากปรับความกว้างคอลัมน์ (จำค่าไว้ใน localStorage)
function makeResizable(table, key){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch {}
  table.classList.add('fc-table--fixed');
  [...table.tHead.rows[0].cells].forEach((th, i) => {
    if (saved[i]) th.style.width = saved[i] + 'px';
    const grip = document.createElement('span');
    grip.className = 'fc-col-resize';
    th.appendChild(grip);
    grip.addEventListener('click', e => e.stopPropagation());   // อย่าให้ทริกเกอร์ sort
    grip.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const sx = e.clientX, sw = th.offsetWidth;
      const move = ev => { th.style.width = Math.max(44, sw + ev.clientX - sx) + 'px'; };
      const up = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        saved[i] = th.offsetWidth;
        try { localStorage.setItem(key, JSON.stringify(saved)); } catch {}
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  });
}
let toastTimer;
function toast(msg, err){
  const el = $('toast'); el.textContent = msg;
  el.className = 'fc-toast is-show' + (err ? ' fc-toast--err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'fc-toast', 3200);
}
function show(id){ ['viewLogin','viewDash'].forEach(v => $(v).classList.toggle('fc-hidden', v !== id)); }

/* ---------- theme ---------- */
function setTheme(m){
  document.documentElement.dataset.theme = m;
  localStorage.setItem('dashTheme', m);
  $('btnTheme').textContent = m === 'dark' ? '☀️' : '🌙';
}

/* ---------- boot ---------- */
const CONFIGURED = !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);
const sb = CONFIGURED ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey) : null;
let ME = '';

async function boot(){
  $('appVer').textContent = 'v' + APP_VERSION;
  console.log('%cFTH Survey Dashboard ' + APP_VERSION, 'font-weight:bold');
  setTheme(localStorage.getItem('dashTheme') || 'light');
  $('btnTheme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  $('langSelect').value = lang;
  applyI18n();
  $('langSelect').onchange = e => {
    lang = e.target.value; localStorage.setItem('dashLang', lang);
    applyI18n();
    if (!$('viewDash').classList.contains('fc-hidden')) render();
  };
  $('btnLogout').onclick = async () => {
    try { await sb.auth.signOut({ scope: 'local' }); } catch {}
    location.href = 'survey.html?loggedout=1';
  };

  if (!CONFIGURED) { $('cfgBanner').textContent = 'Supabase config missing'; $('cfgBanner').classList.remove('fc-hidden'); show('viewLogin'); return; }
  wirePwUi();
  $('engModalClose').onclick = () => $('engModal').classList.add('fc-hidden');

  // มาจากลิงก์ "ลืมรหัสผ่าน" ในอีเมล
  if (location.hash.includes('type=recovery')) { show('viewLogin'); wireLogin(); return; }

  const { data:{ session } } = await sb.auth.getSession();
  if (session && isExecEmail(session.user.email)) { ME = (session.user.email||'').toLowerCase(); return startDash(); }
  if (session) await sb.auth.signOut();
  show('viewLogin');
  wireLogin();
}

function isExecEmail(email){ return EXEC_ALLOWLIST.includes((email || '').toLowerCase()); }

/* ---------- เปลี่ยน / ลืมรหัสผ่าน ---------- */
let pwRecovery = false;
function openPwModal(isRecovery){
  pwRecovery = !!isRecovery;
  $('pwNew').value = ''; $('pwNew2').value = ''; $('pwErr').textContent = '';
  $('pwTitle').textContent = isRecovery ? t('pwSetNew') : t('changePw');
  $('pwModal').classList.remove('fc-hidden');
  $('pwNew').focus();
}
function wirePwUi(){
  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') { show('viewLogin'); openPwModal(true); }
  });
  $('btnChgPw').onclick = () => openPwModal(false);
  $('pwCancel').onclick = () => $('pwModal').classList.add('fc-hidden');
  $('linkForgot').onclick = async (e) => {
    e.preventDefault();
    const email = $('loginEmail').value.trim().toLowerCase();
    if (!email) { toast(t('enterEmailFirst'), true); $('loginEmail').focus(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) return toast(error.message, true);
    toast(t('resetSent'));
  };
  $('pwSave').onclick = async () => {
    const a = $('pwNew').value, b = $('pwNew2').value;
    if (a.length < 6) { $('pwErr').textContent = t('pwTooShort'); return; }
    if (a !== b)      { $('pwErr').textContent = t('pwMismatch'); return; }
    $('pwSave').disabled = true;
    const { error } = await sb.auth.updateUser({ password: a });
    $('pwSave').disabled = false;
    if (error) { $('pwErr').textContent = error.message; return; }
    $('pwModal').classList.add('fc-hidden');
    toast(t('pwChanged'));
    if (pwRecovery) {
      try { await sb.auth.signOut({ scope: 'local' }); } catch {}
      location.href = 'survey.html?loggedout=1';
    }
  };
}

function wireLogin(){
  $('btnLogin').onclick = async () => {
    const email = $('loginEmail').value.trim().toLowerCase();
    const password = $('loginPass').value;
    if (!email || !password) return;
    $('btnLogin').disabled = true;
    try {

    }

// ผู้นำเดือนนี้/เดือนก่อน (ไม่ขึ้นกับตัวกรอง) — คะแนนสูงสุด + ทำมากสุด
let leaders = null;
async function loadLeaders(){
  const now = new Date();
  const lmStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  let { data, error } = await sb.from('v_survey_by_engineer')
    .select('engineer_id,fname,lname,department,submitted_at,q1_response_time,q2_technical_skill,q3_communication_cost,q4_professionalism,q5_overall')
    .gte('submitted_at', lmStart.toISOString());
  // ยังไม่ได้รัน migrate_batch2.sql -> view นี้ไม่มี: ใช้ v_survey_full แทน (นับแค่ lead engineer ต่องาน)
  if (error) {
    ({ data } = await sb.from('v_survey_full')
      .select('engineer_id,fname,lname,department,submitted_at,q1_response_time,q2_technical_skill,q3_communication_cost,q4_professionalism,q5_overall')
      .gte('submitted_at', lmStart.toISOString()));
  }
  const mKey = d => { const x = new Date(d); return x.getFullYear() + '-' + x.getMonth(); };
  const curKey = now.getFullYear() + '-' + now.getMonth();
  const lastKey = lmStart.getFullYear() + '-' + lmStart.getMonth();
  const bucket = { [curKey]: {}, [lastKey]: {} };
  (data || []).forEach(r => {
    const k = mKey(r.submitted_at); if (!bucket[k]) return;
    const g = bucket[k][r.engineer_id] || (bucket[k][r.engineer_id] =
      { name:`${r.fname||''} ${r.lname||''}`.trim(), dept:r.department||'', n:0, sum:0 });
    g.n++;
    g.sum += (r.q1_response_time + r.q2_technical_skill + r.q3_communication_cost + r.q4_professionalism + r.q5_overall) / 5;
  });
  const pick = (k, by) => {
    const arr = Object.values(bucket[k] || {});
    if (!arr.length) return null;
    return by === 'rate'
      ? arr.slice().sort((a,b) => (b.sum/b.n) - (a.sum/a.n))[0]
      : arr.slice().sort((a,b) => b.n - a.n)[0];
  };
  leaders = {
    rateM: pick(curKey, 'rate'), respM: pick(curKey, 'resp'),
    rateL: pick(lastKey, 'rate'), respL: pick(lastKey, 'resp'),
  };
  renderKpis();
}

function setRange(kind){
  const now = new Date(), p = n => String(n).padStart(2,'0');
  const iso = d => `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  if (kind === 'all') { $('fFrom').value = ''; $('fTo').value = ''; }
  else if (kind === 'today') { $('fFrom').value = iso(now); $('fTo').value = iso(now); }
  else if (kind === 'yesterday') {
    const y = new Date(now); y.setDate(y.getDate() - 1);
    $('fFrom').value = iso(y); $('fTo').value = iso(y);
  }
  else if (kind === 'thisweek') {
    const day = (now.getDay() + 6) % 7;   // จันทร์ = 0
    const mon = new Date(now); mon.setDate(mon.getDate() - day);
    $('fFrom').value = iso(mon); $('fTo').value = iso(now);
  }
  else if (kind === 'lastmonth') {
    $('fFrom').value = iso(new Date(now.getFullYear(), now.getMonth() - 1, 1));
    $('fTo').value   = iso(new Date(now.getFullYear(), now.getMonth(), 0));   // วันสุดท้ายเดือนก่อน
  } else {
    const start = kind === 'month' ? new Date(now.getFullYear(), now.getMonth(), 1)
                                   : new Date(now.getFullYear(), 0, 1);
    $('fFrom').value = iso(start); $('fTo').value = iso(now);
  }
  applyFilter();
}

/* ---------- sorting ---------- */
let detSort  = { key: 'submitted_at', dir: 'desc' };
let rankSort = { key: 'avg', dir: 'desc' };

function sortVal(kind, o, key){
  if (kind === 'det') return key === 'engineer' ? `${o.fname||''} ${o.lname||''}` : o[key];
  return key[0] === 'q' && key.length === 2 ? o.q[+key[1]] / o.n : o[key];   // q0..q4 = avg ต่อข้อ
}
function sortArr(arr, st, kind){
  return arr.slice().sort((a, b) => {
    let x = sortVal(kind, a, st.key), y = sortVal(kind, b, st.key), c;
    if (st.key === 'submitted_at' || st.key === 'job_created_at') c = new Date(x) - new Date(y);
    else {
      const nx = parseFloat(x), ny = parseFloat(y),
            xn = isFinite(nx) && String(x).trim() !== '',
            yn = isFinite(ny) && String(y).trim() !== '';
      if (xn && yn) c = nx - ny;
      else c = String(x ?? '').localeCompare(String(y ?? ''), 'th');
    }
    return st.dir === 'asc' ? c : -c;
  });
}
// สร้าง <th> ที่กดเรียงได้
function th(label, key, st, cls, style){
  const ind = st.key === key ? (st.dir === 'asc' ? '▲' : '▼') : '↕';
  return `<th${cls ? ` class="${cls}"` : ''}${style ? ` style="${style}"` : ''} data-sort="${key}">${label}<span class="sort-ind${st.key === key ? ' on' : ''}">${ind}</span></th>`;
}
function wireSort(table, st, rerender){
  table.querySelectorAll('th[data-sort]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.sort;
      if (st.key === k) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
      else { st.key = k; st.dir = 'asc'; }
      rerender();
    };
  });
}

async function applyFilter(){

  if (engId) {

  }

  // รายบุคคล (1 แถวต่อ 1 คำตอบ ต่อ 1 วิศวกรในทีม) — ใช้คำนวณอันดับ/KPI ให้ทุกคนในทีมเท่ากัน
  let qr = sb.from('v_survey_by_engineer').select('*');

  render();

function agg(){
  const g = {};
  rankRows.forEach(r => {
    const k = r.engineer_id;
    (g[k] = g[k] || { engineer_id:k, name:`${r.fname||''} ${r.lname||''}`.trim(), dept:r.department||'', n:0, q:[0,0,0,0,0] });
    g[k].n++;
    g[k].q[0]+=r.q1_response_time; g[k].q[1]+=r.q2_technical_skill; g[k].q[2]+=r.q3_communication_cost;
    g[k].q[3]+=r.q4_professionalism; g[k].q[4]+=r.q5_overall;
  });
  return Object.values(g).map(e => ({ ...e, avg: e.q.reduce((s,x)=>s+x,0)/5/e.n }));
}

// แสดงดาว 5 ดวงเติมสีตามสัดส่วนจริง (เช่น 4.3/5 = ดวงที่ 5 เติมเหลือง 30%) ไม่ปัดเป็นครึ่งดวง
function starsHtml(value, max = 5){
  const v = Math.max(0, Math.min(max, value || 0));
  let out = `<span class="stars" title="${v.toFixed(2)}/${max}">`;
  for (let i = 0; i < max; i++) {
    const pct = Math.max(0, Math.min(100, (v - i) * 100));
    out += `<span class="star" style="--p:${pct.toFixed(0)}%">★</span>`;
  }
  return out + `</span>`;
}

function rateBadge(v){
  if (v >= 4.5) return `<span class="fc-badge fc-badge--ok">${t('rateHigh')} ${v.toFixed(2)}</span>`;
  if (v >= 3.5) return `<span class="fc-badge fc-badge--info">${t('rateMid')} ${v.toFixed(2)}</span>`;
  return `<span class="fc-badge fc-badge--danger">${t('rateLow')} ${v.toFixed(2)}</span>`;
}

function leaderCard(labelKey, g, kind){
  const body = g
    ? `<div class="kpi-name">🥇 ${esc(g.name)}</div>
       <div class="fc-kpi__sub">${esc(g.dept)} · ${kind === 'rate'
          ? (g.sum / g.n).toFixed(2) + ' ' + t('unitScore') + ' ' + starsHtml(g.sum / g.n) + ' · ' + g.n + ' ' + t('unitResp')
          : g.n + ' ' + t('unitResp') + ' · ' + (g.sum / g.n).toFixed(2) + ' ' + t('unitScore') + ' ' + starsHtml(g.sum / g.n)}</div>`
    : `<div class="kpi-name" style="color:var(--fc-text-mute)">${t('kpiNoData')}</div>`;
  return `<div class="fc-kpi"><div class="fc-kpi__label">${t(labelKey)}</div>${body}</div>`;
}

function renderKpis(){
  const box = $('kpis');
  const L = leaders || {};

    ? `<div class="fc-kpi"><div class="fc-kpi__label">${t('kpiResponses')}</div>
         <div class="fc-kpi__value">${rows.length}</div></div>
       <div class="fc-kpi"><div class="fc-kpi__label">${t('kpiAvg')}</div>
         <div class="fc-kpi__value">${(rows.reduce((s,r)=>s+qsum(r)/5,0)/rows.length).toFixed(2)} ${starsHtml(rows.reduce((s,r)=>s+qsum(r)/5,0)/rows.length)}</div>
         <div class="fc-kpi__sub">${rateBadge(rows.reduce((s,r)=>s+qsum(r)/5,0)/rows.length)}</div></div>`
    : '';
  box.innerHTML = filtered
    + leaderCard('kpiTopRateM', L.rateM, 'rate')
    + leaderCard('kpiTopRespM', L.respM, 'resp')
    + leaderCard('kpiTopRateL', L.rateL, 'rate')

// อายุงาน (ปีเต็ม) จาก hire_date = 'YYYY-MM-DD' — อย่างน้อย 1
function yearsFromHire(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  if (!m) return null;
  const hire = new Date(+m[1], +m[2] - 1, +m[3]);
  const now = new Date();
  let y = now.getFullYear() - hire.getFullYear();
  const anniv = new Date(now.getFullYear(), hire.getMonth(), hire.getDate());
  if (now < anniv) y -= 1;
  return Math.max(1, y);
}

  // สถิติจากข้อมูลที่โหลดไว้แล้วในตัวกรองปัจจุบัน — ไม่ยิง query เพิ่ม
  const list = agg();
  const sorted = list.slice().sort((a,b) => b.avg - a.avg);
  const mine = list.find(x => x.engineer_id === engineerId);

  const qLabels = [t('q1'), t('q2'), t('q3'), t('q4'), t('q5')];

    .slice(0, 3);

  body.innerHTML = `
    <div class="ep-head">${photo}<div><div class="ep-name">${esc(e.fname)} ${esc(e.lname)}</div><div class="ep-meta">${metaLines}</div></div></div>
    <div class="ep-stats-grid">
      <div class="ep-stat"><div class="v">${mine ? mine.n : 0}</div><div class="l">${t('colCount')}</div></div>
      <div class="ep-stat"><div class="v">${mine ? mine.avg.toFixed(2) : '—'}${mine ? ' ' + starsHtml(mine.avg) : ''}${rank ? ` <span style="font-size:12px;color:var(--fc-text-mute)">${t('epRank')} #${rank}</span>` : ''}</div><div class="l">${t('colAvg')}</div></div>
    </div>
    <p class="fc-mut" style="margin:0 0 6px">${t('epStats')}</p>
    ${bars}
    <p class="fc-mut" style="margin:var(--fc-s3) 0 6px">${t('epRecentComments')}</p>
    ${comments.length ? comments.map(c => `<div class="ep-comment">${esc(c.comment)}<div style="font-size:11px;color:var(--fc-text-mute);margin-top:2px">${fmtDateTime(c.submitted_at)}</div></div>`).join('') : `<p class="fc-mut">${t('epNoComments')}</p>`}
  `;
}

      ${th(t('colTeam'), 'team_names', S, '', 'width:170px')}
      ${th(t('colDept'), 'department', S, '', 'width:150px')}
      ${th(t('colReport'), 'service_report_no', S, 'fc-c', 'width:88px')}
      ${th(t('colOrder'), 'service_order_no', S, 'fc-c', 'width:88px')}
      ${th(t('colCustomer'), 'customer_name', S, '', 'width:140px')}
      ${th(t('q1'), 'q1_response_time', S, 'fc-c', 'width:54px')}${th(t('q2'), 'q2_technical_skill', S, 'fc-c', 'width:54px')}
      ${th(`<span title="${esc(t('q3Full'))}">${t('q3')}</span>`, 'q3_communication_cost', S, 'fc-c', 'width:96px')}${th(t('q4'), 'q4_professionalism', S, 'fc-c', 'width:54px')}
      ${th(t('q5'), 'q5_overall', S, 'fc-c', 'width:64px')}
      ${th(t('colComment'), 'comment', S, '', 'width:320px')}
      ${th(t('colEmail'), 'customer_email', S, '', 'width:170px')}
      ${th(t('colGeo'), 'geo_area', S, '', 'width:150px')}
      ${th(t('colIP'), 'client_ip', S, '', 'width:118px')}

    <tbody>${view.map((r,k) => `

        <td class="fc-n"><div>${fmtD(r.submitted_at)}</div><div style="color:var(--fc-text-mute);font-size:12px">${fmtT(r.submitted_at)}</div></td>
        <td><a href="#" class="eng-link" data-eid="${esc(r.engineer_id||'')}">${esc(`${r.fname||''} ${r.lname||''}`.trim())}</a></td>

        <td>${esc(r.department||'')}</td>

// สร้างเลขหน้าแบบมีช่องว่าง (...) เช่น 1 … 4 5 [6] 7 8 … 20
function pageWindow(cur, max){
  const span = 2, out = [];
  const lo = Math.max(0, cur - span), hi = Math.min(max, cur + span);
  if (lo > 0) { out.push(0); if (lo > 1) out.push('gap'); }
  for (let i = lo; i <= hi; i++) out.push(i);
  if (hi < max) { if (hi < max - 1) out.push('gap'); out.push(max); }
  return out;
}

function goPage(n, maxPage){
  const p = Math.min(maxPage, Math.max(0, n | 0));
  if (p !== page) { page = p; renderDetail(); }
}

function renderPager(total, start, shown, maxPage){
  const opts = [10, 25, 50, 100].map(n =>
    `<option value="${n}"${n === pageSize ? ' selected' : ''}>${n}</option>`).join('');
  const nums = pageWindow(page, maxPage).map(x => x === 'gap'
    ? `<span class="pg-gap">…</span>`
    : `<button class="pg-num${x === page ? ' on' : ''}" data-pg="${x}" title="${t('pageX', { p: x + 1 })}">${x + 1}</button>`
  ).join('');
  $('pager').innerHTML = `
    <select class="fc-select" id="pgSize">${opts}</select>
    <span>${t('perPage')}</span>
    <span class="fc-right">${t('pageInfo', { a: total ? start + 1 : 0, b: start + shown, n: total })}</span>
    <button class="fc-btn fc-btn--sm" id="pgFirst"${page <= 0 ? ' disabled' : ''}>« ${t('firstPg')}</button>
    <button class="fc-btn fc-btn--sm" id="pgPrev"${page <= 0 ? ' disabled' : ''}>‹ ${t('prev')}</button>
    <span class="pg-nums" id="pgNums">${nums}</span>
    <button class="fc-btn fc-btn--sm" id="pgNext"${page >= maxPage ? ' disabled' : ''}>${t('next')} ›</button>
    <button class="fc-btn fc-btn--sm" id="pgLast"${page >= maxPage ? ' disabled' : ''}>${t('lastPg')} »</button>
    ${maxPage > 4 ? `<input class="fc-input pg-jump" id="pgJump" type="number" min="1" max="${maxPage + 1}" placeholder="${page + 1}">
      <button class="fc-btn fc-btn--sm" id="pgGo">${t('goPg')}</button>` : ''}`;
  $('pgSize').onchange = e => {
    pageSize = parseInt(e.target.value, 10) || 10;
    localStorage.setItem('dashPageSize', pageSize);
    page = 0; renderDetail();
  };
  $('pgFirst').onclick = () => goPage(0, maxPage);
  $('pgPrev').onclick = () => goPage(page - 1, maxPage);
  $('pgNext').onclick = () => goPage(page + 1, maxPage);
  $('pgLast').onclick = () => goPage(maxPage, maxPage);
  $('pgNums').querySelectorAll('.pg-num').forEach(b =>
    b.onclick = () => goPage(parseInt(b.dataset.pg, 10), maxPage));
  const jump = $('pgJump');
  if (jump) {
    const go = () => { const v = parseInt(jump.value, 10); if (v) goPage(v - 1, maxPage); };
    $('pgGo').onclick = go;
    jump.onkeydown = e => { if (e.key === 'Enter') go(); };
  }
}

// เปิดลายเซ็นพร้อมลายน้ำกันเอาไปเผยแพร่ (ฝัง Report/Order + อีเมลผู้เปิด + เวลา ไว้ตามรอยได้)
async function viewSignature(path, rp, so){
  try {
    const { data, error } = await sb.storage.from('survey-signatures').createSignedUrl(path, 3600);
    if (error) throw error;
    const blob = await (await fetch(data.signedUrl)).blob();
    const src = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const pad = 40, foot = 44;
      const cv = document.createElement('canvas');
      cv.width = img.width + pad * 2;
      cv.height = img.height + pad * 2 + foot;
      const g = cv.getContext('2d');
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, pad, pad);
      // ลายน้ำเฉียง — เว้นระยะจากความกว้างข้อความจริง ไม่ให้ทับกัน
      const stamp = `FANUC THAI LIMITED · RP ${rp || '-'} · SO ${so || '-'} · ${ME} · ${fmtDateTime(new Date().toISOString())} · ${t('wmShort')}`;
      g.save();
      g.translate(cv.width / 2, cv.height / 2);
      g.rotate(-0.38);
      g.font = '15px Sarabun, Tahoma, sans-serif';
      g.fillStyle = 'rgba(120,120,120,0.16)';
      g.textAlign = 'center';
      const stepX = Math.ceil(g.measureText(stamp).width + 130);
      const stepY = 94;
      let ri = 0;
      for (let y = -cv.height; y < cv.height * 1.4; y += stepY, ri++) {
        const off = (ri % 2) * (stepX / 2);
        for (let x = -cv.width; x < cv.width * 1.4; x += stepX) g.fillText(stamp, x + off, y);
      }
      g.restore();
      // แถบข้อความท้ายภาพ
      g.fillStyle = '#f1f1f1'; g.fillRect(0, cv.height - foot, cv.width, foot);
      g.fillStyle = '#555555'; g.font = '12px Sarabun, Tahoma, sans-serif'; g.textAlign = 'center';
      g.fillText(`${t('wmFull')}  ·  RP ${rp || '-'} / SO ${so || '-'}`, cv.width / 2, cv.height - foot / 2 + 4);
      URL.revokeObjectURL(src);
      const w = window.open();
      if (w) w.document.write(`<title>signature</title><body style="margin:0;background:#333;text-align:center"><img src="${cv.toDataURL('image/png')}" style="max-width:100%">`);
      else toast(t('popupBlocked'), true);
    };
    img.onerror = () => toast('load error', true);
    img.src = src;
  } catch (e) { toast(e.message || e, true); }
}

function detailRowsForXlsx(){
  return sortArr(rows, detSort, 'det').map(r => ({
    submitted_at: fmtDateTime(r.submitted_at),
    engineer: `${r.fname||''} ${r.lname||''}`.trim(),
    team: r.team_names || '',
    department: r.department || '', title: r.title || '', tel: r.tel || '',
    service_report_no: r.service_report_no || '', service_order_no: r.service_order_no || '',
    customer_name: r.customer_name || '',
    location_area: r.geo_area || '',
    geo_lat: r.geo_lat != null ? r.geo_lat : '', geo_lng: r.geo_lng != null ? r.geo_lng : '',
    geo_accuracy_m: r.geo_accuracy != null ? Math.round(r.geo_accuracy) : '',
    client_ip: r.client_ip || '', client_ua: r.client_ua || '',
    q1_response_time: r.q1_response_time, q2_technical_skill: r.q2_technical_skill,
    q3_communication_cost: r.q3_communication_cost, q4_professionalism: r.q4_professionalism,
    q5_overall: r.q5_overall, comment: r.comment || '',
    customer_email: r.customer_email || '', thanks_sent: r.customer_email ? (r.thanks_sent ? 'sent' : 'pending') : '',
  }));
}
function rankingRowsForXlsx(){
  const minN = Math.max(1, parseInt($('fMinN').value, 10) || 1);
  return sortArr(agg().filter(e => e.n >= minN), rankSort, 'rank').map((e,i) => ({
    rank: i + 1, engineer: e.name, department: e.dept, responses: e.n,
    avg_q1:+(e.q[0]/e.n).toFixed(2), avg_q2:+(e.q[1]/e.n).toFixed(2), avg_q3:+(e.q[2]/e.n).toFixed(2),
    avg_q4:+(e.q[3]/e.n).toFixed(2), avg_q5:+(e.q[4]/e.n).toFixed(2), avg_overall:+e.avg.toFixed(2),
  }));
}
function saveXlsx(sheets, tag){
  if (!rows.length) return toast(t('noResults'), true);
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, data]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), name));
  const d = new Date(), p = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `survey_${tag}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`);
}
function exportXlsx()   { saveXlsx([['ranking', rankingRowsForXlsx()], ['detail', detailRowsForXlsx()]], 'all'); }
function exportRanking(){ saveXlsx([['ranking', rankingRowsForXlsx()]], 'ranking'); }
function exportDetail() { saveXlsx([['detail', detailRowsForXlsx()]], 'responses'); }

boot();
