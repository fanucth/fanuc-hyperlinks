let lang = localStorage.getItem('dashLang') || 'th';
function t(key, vars){
  let s = (I18N[key] && (I18N[key][lang] || I18N[key].th)) || key;
  if (vars) for (const k in vars) s = s.replace(`{${k}}`, vars[k]);
  return s;
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.documentElement.lang = lang;
}

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateTime(iso){
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let toastTimer;
function toast(msg, err){
  const el = $('toast'); el.textContent = msg;
  el.className = 'fc-toast is-show' + (err ? ' fc-toast--err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'fc-toast', 3200);
}
function show(id){ ['viewLogin','viewDash'].forEach(v => $(v).classList.toggle('fc-hidden', v !== id)); }

/* ---------- theme ---------- */
function setTheme(m){
  document.documentElement.dataset.theme = m;
  localStorage.setItem('dashTheme', m);
  $('btnTheme').textContent = m === 'dark' ? '☀️' : '🌙';
}

/* ---------- boot ---------- */
const CONFIGURED = !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);
const sb = CONFIGURED ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey) : null;
let ME = '';

async function boot(){
  $('appVer').textContent = 'v' + APP_VERSION;
  console.log('%cFTH Survey Dashboard ' + APP_VERSION, 'font-weight:bold');
  setTheme(localStorage.getItem('dashTheme') || 'light');
  $('btnTheme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  $('langSelect').value = lang;
  applyI18n();
  $('langSelect').onchange = e => {
    lang = e.target.value; localStorage.setItem('dashLang', lang);
    applyI18n();
    if (!$('viewDash').classList.contains('fc-hidden')) render();
  };
  $('btnLogout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

  if (!CONFIGURED) { $('cfgBanner').textContent = 'Supabase config missing'; $('cfgBanner').classList.remove('fc-hidden'); show('viewLogin'); return; }

  const { data:{ session } } = await sb.auth.getSession();
  if (session && isExecEmail(session.user.email)) { ME = (session.user.email||'').toLowerCase(); return startDash(); }
  if (session) await sb.auth.signOut();
  show('viewLogin');
  wireLogin();
}

function isExecEmail(email){ return EXEC_ALLOWLIST.includes((email || '').toLowerCase()); }

function wireLogin(){
  $('btnLogin').onclick = async () => {
    const email = $('loginEmail').value.trim().toLowerCase();
    const password = $('loginPass').value;
    if (!email || !password) return;
    $('btnLogin').disabled = true;
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      if (!isExecEmail(data.user.email)) { await sb.auth.signOut(); return toast(t('notExec'), true); }
      ME = (data.user.email || '').toLowerCase();
      startDash();
    } catch (e) {
      toast(t('loginFail', { err: e.message || e }), true);
    } finally {
      $('btnLogin').disabled = false;
    }
  };
}

/* ---------- dashboard ---------- */
let rows = [];

async function startDash(){
  show('viewDash');
  $('btnLogout').classList.remove('fc-hidden');
  $('fEngineer').options[0].text = '— All —';
  $('fDept').options[0].text = '— All —';
  const { data: engs } = await sb.from('engineers').select('id,fname,lname,department').order('fname');
  const depts = new Set();
  (engs || []).forEach(e => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = `${e.fname} ${e.lname}`;
    $('fEngineer').appendChild(o);
    if (e.department) depts.add(e.department);
  });
  [...depts].sort().forEach(d => {
    const o = document.createElement('option'); o.value = d; o.textContent = d;
    $('fDept').appendChild(o);
  });
  $('btnApply').onclick = applyFilter;
  $('btnExport').onclick = exportXlsx;
  $('qMonth').onclick = () => setRange('month');
  $('qYear').onclick  = () => setRange('year');
  $('qAll').onclick   = () => setRange('all');
  $('fMinN').onchange = render;
  loadGeoSetting();
  $('setGeo').onchange = saveGeoSetting;
  applyFilter();
}

async function loadGeoSetting(){
  const { data } = await sb.from('app_settings').select('value,updated_at,updated_by').eq('key','geo_capture').maybeSingle();
  const on = data && data.value === 'on';
  $('setGeo').checked = on;
  let info = on ? t('geoOnInfo') : t('geoOffInfo');
  if (data && data.updated_by) info += ' · ' + t('geoUpdatedBy', { who: data.updated_by, when: fmtDateTime(data.updated_at) });
  $('setGeoInfo').textContent = info;
}
async function saveGeoSetting(){
  const on = $('setGeo').checked;
  const { error } = await sb.from('app_settings').upsert(
    { key:'geo_capture', value: on ? 'on' : 'off', updated_at: new Date().toISOString(), updated_by: ME },
    { onConflict: 'key' }
  );
  if (error) { toast(error.message, true); $('setGeo').checked = !on; return; }
  toast('OK');
  loadGeoSetting();
}

function setRange(kind){
  const now = new Date(), p = n => String(n).padStart(2,'0');
  const iso = d => `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  if (kind === 'all') { $('fFrom').value = ''; $('fTo').value = ''; }
  else {
    const start = kind === 'month' ? new Date(now.getFullYear(), now.getMonth(), 1)
                                   : new Date(now.getFullYear(), 0, 1);
    $('fFrom').value = iso(start); $('fTo').value = iso(now);
  }
  applyFilter();
}

function qsum(r){ return r.q1_response_time + r.q2_technical_skill + r.q3_communication_cost + r.q4_professionalism + r.q5_overall; }
function skeleton(box){
  box.innerHTML = Array.from({length:6}).map(() =>
    `<div class="fc-skeleton" style="height:20px;margin:10px 12px"></div>`).join('');
}

async function applyFilter(){
  const from = $('fFrom').value ? new Date($('fFrom').value + 'T00:00:00').toISOString() : null;
  const to   = $('fTo').value   ? new Date($('fTo').value   + 'T23:59:59').toISOString() : null;
  const engId = $('fEngineer').value;
  const dept  = $('fDept').value;

  skeleton($('sumBox')); skeleton($('detBox'));

  let q = sb.from('v_survey_full').select('*').order('submitted_at', { ascending:false });
  if (from) q = q.gte('submitted_at', from);
  if (to)   q = q.lte('submitted_at', to);
  if (engId) q = q.eq('engineer_id', engId);
  if (dept)  q = q.eq('department', dept);

  const { data, error } = await q;
  if (error) {
    $('sumBox').innerHTML = `<div class="fc-empty">${esc(error.message)}</div>`;
    $('detBox').innerHTML = ''; $('kpis').innerHTML = '';
    return;
  }
  rows = data || [];
  render();
}

function render(){
  renderKpis();
  renderRanking();
  renderDetail();
}

function agg(){
  const g = {};
  rows.forEach(r => {
    const k = r.engineer_id;
    (g[k] = g[k] || { name:`${r.fname||''} ${r.lname||''}`.trim(), dept:r.department||'', n:0, q:[0,0,0,0,0] });
    g[k].n++;
    g[k].q[0]+=r.q1_response_time; g[k].q[1]+=r.q2_technical_skill; g[k].q[2]+=r.q3_communication_cost;
    g[k].q[3]+=r.q4_professionalism; g[k].q[4]+=r.q5_overall;
  });
  return Object.values(g).map(e => ({ ...e, avg: e.q.reduce((s,x)=>s+x,0)/5/e.n }));
}

function rateBadge(v){
  if (v >= 4.5) return `<span class="fc-badge fc-badge--ok">${t('rateHigh')} ${v.toFixed(2)}</span>`;
  if (v >= 3.5) return `<span class="fc-badge fc-badge--info">${t('rateMid')} ${v.toFixed(2)}</span>`;
  return `<span class="fc-badge fc-badge--danger">${t('rateLow')} ${v.toFixed(2)}</span>`;
}

function renderKpis(){
  const box = $('kpis');
  if (!rows.length) { box.innerHTML = ''; return; }
  const overall = rows.reduce((s,r) => s + qsum(r)/5, 0) / rows.length;
  const list = agg().sort((a,b) => b.avg - a.avg);
  const top = list[0];
  box.innerHTML = `
    <div class="fc-kpi"><div class="fc-kpi__label">${t('kpiResponses')}</div>
      <div class="fc-kpi__value">${rows.length}</div></div>
    <div class="fc-kpi"><div class="fc-kpi__label">${t('kpiAvg')}</div>
      <div class="fc-kpi__value">${overall.toFixed(2)}</div>
      <div class="fc-kpi__sub">${rateBadge(overall)}</div></div>
    <div class="fc-kpi"><div class="fc-kpi__label">${t('kpiTop')}</div>
      <div class="fc-kpi__value" style="font-size:20px">🥇 ${esc(top.name)}</div>
      <div class="fc-kpi__sub">${esc(top.dept)} · ${top.avg.toFixed(2)} · ${top.n} ${t('colCount')}</div></div>
    <div class="fc-kpi"><div class="fc-kpi__label">${t('kpiEngineers')}</div>
      <div class="fc-kpi__value">${list.length}</div></div>`;
}

function renderRanking(){
  $('rankNote').textContent = t('rankNoteTxt');
  const box = $('sumBox');
  if (!rows.length) {
    box.innerHTML = `<div class="fc-empty"><div class="fc-empty__title">${t('noResults')}</div><div>${t('emptyHint')}</div></div>`;
    return;
  }
  const minN = Math.max(1, parseInt($('fMinN').value, 10) || 1);
  const list = agg().filter(e => e.n >= minN).sort((a,b) => b.avg - a.avg);
  const c = v => `<td class="fc-n">${v.toFixed(2)}</td>`;
  const medal = i => i === 0 ? '<span class="medal">🥇</span>' : i === 1 ? '<span class="medal">🥈</span>' : i === 2 ? '<span class="medal">🥉</span>' : (i + 1);
  box.innerHTML = `<table class="fc-table fc-table--zebra">
    <thead><tr>
      <th class="fc-rank">${t('colRank')}</th><th>${t('colEngineer')}</th><th>${t('colDept')}</th>
      <th class="fc-n">${t('colCount')}</th>
      <th class="fc-n">${t('q1')}</th><th class="fc-n">${t('q2')}</th><th class="fc-n">${t('q3')}</th>
      <th class="fc-n">${t('q4')}</th><th class="fc-n">${t('q5')}</th><th class="fc-n">${t('colAvg')}</th>
    </tr></thead>
    <tbody>${list.map((e,i) => `
      <tr>
        <td class="fc-rank">${medal(i)}</td>
        <td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td class="fc-n">${e.n}</td>
        ${c(e.q[0]/e.n)}${c(e.q[1]/e.n)}${c(e.q[2]/e.n)}${c(e.q[3]/e.n)}${c(e.q[4]/e.n)}
        <td class="fc-n"><b>${e.avg.toFixed(2)}</b></td>
      </tr>`).join('')}</tbody></table>`;
}

function renderDetail(){
  const box = $('detBox');
  $('detCount').textContent = rows.length ? `${rows.length}` : '';
  if (!rows.length) { box.innerHTML = `<div class="fc-empty">${t('noResults')}</div>`; return; }
  box.innerHTML = `<table class="fc-table fc-table--zebra">
    <thead><tr>
      <th class="fc-n">#</th><th>${t('colDate')}</th><th>${t('colEngineer')}</th>
      <th>${t('colReport')}</th><th>${t('colOrder')}</th>
      <th class="fc-n">${t('q1')}</th><th class="fc-n">${t('q2')}</th><th class="fc-n">${t('q3')}</th>
      <th class="fc-n">${t('q4')}</th><th class="fc-n">${t('q5')}</th>
      <th>${t('colComment')}</th><th>${t('colGeo')}</th><th>${t('colSig')}</th>
    </tr></thead>
    <tbody>${rows.map((r,i) => `
      <tr>
        <td class="fc-n">${i+1}</td>
        <td class="fc-n">${fmtDateTime(r.submitted_at)}</td>
        <td>${esc(`${r.fname||''} ${r.lname||''}`.trim())}</td>
        <td class="fc-n">${esc(r.service_report_no||'')}</td>
        <td class="fc-n">${esc(r.service_order_no||'')}</td>
        <td class="fc-n">${r.q1_response_time}</td><td class="fc-n">${r.q2_technical_skill}</td><td class="fc-n">${r.q3_communication_cost}</td>
        <td class="fc-n">${r.q4_professionalism}</td><td class="fc-n">${r.q5_overall}</td>
        <td style="max-width:240px;white-space:normal;word-break:break-word" title="${esc(r.comment||'')}">${esc(r.comment||'')}</td>
        <td>${r.geo_lat != null
          ? `<a class="geo-link" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.geo_lat},${r.geo_lng}">📍${r.geo_accuracy != null ? ' ±'+Math.round(r.geo_accuracy)+'m' : ''}</a>`
          : ''}</td>
        <td><a href="#" class="sig-link" data-sig="${esc(r.signature_path||'')}">👁</a></td>
      </tr>`).join('')}</tbody></table>`;

  box.querySelectorAll('a[data-sig]').forEach(a => {
    a.onclick = ev => { ev.preventDefault(); if (a.dataset.sig) viewSignature(a.dataset.sig); };
  });
}

// เปิดลายเซ็นพร้อมลายน้ำกันเอาไปเผยแพร่ (ฝัง อีเมลผู้เปิด + เวลา ไว้ตามรอยได้)
async function viewSignature(path){
  try {
    const { data, error } = await sb.storage.from('survey-signatures').createSignedUrl(path, 3600);
    if (error) throw error;
    const blob = await (await fetch(data.signedUrl)).blob();
    const src = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const pad = 40, foot = 44;
      const cv = document.createElement('canvas');
      cv.width = img.width + pad * 2;
      cv.height = img.height + pad * 2 + foot;
      const g = cv.getContext('2d');
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, pad, pad);
      // ลายน้ำเฉียงปูทั้งภาพ
      const stamp = `FANUC THAI · ${t('wmShort')} · ${ME} · ${fmtDateTime(new Date().toISOString())}`;
      g.save();
      g.translate(cv.width / 2, cv.height / 2);
      g.rotate(-Math.PI / 9);
      g.font = '15px Sarabun, Tahoma, sans-serif';
      g.fillStyle = 'rgba(110,110,110,0.24)';
      g.textAlign = 'center';
      for (let y = -cv.height; y < cv.height; y += 58)
        for (let x = -cv.width; x < cv.width; x += 360)
          g.fillText(stamp, x, y);
      g.restore();
      // แถบข้อความท้ายภาพ
      g.fillStyle = '#f1f1f1'; g.fillRect(0, cv.height - foot, cv.width, foot);
      g.fillStyle = '#555555'; g.font = '12px Sarabun, Tahoma, sans-serif'; g.textAlign = 'center';
      g.fillText(t('wmFull'), cv.width / 2, cv.height - foot / 2 + 4);
      URL.revokeObjectURL(src);
      const w = window.open();
      if (w) w.document.write(`<title>signature</title><body style="margin:0;background:#333;text-align:center"><img src="${cv.toDataURL('image/png')}" style="max-width:100%">`);
      else toast(t('popupBlocked'), true);
    };
    img.onerror = () => toast('load error', true);
    img.src = src;
  } catch (e) { toast(e.message || e, true); }
}

function exportXlsx(){
  if (!rows.length) return toast(t('noResults'), true);
  const detail = rows.map(r => ({
    submitted_at: fmtDateTime(r.submitted_at),
    engineer: `${r.fname||''} ${r.lname||''}`.trim(),
    department: r.department || '', title: r.title || '', tel: r.tel || '',
    service_report_no: r.service_report_no || '', service_order_no: r.service_order_no || '',
    geo_lat: r.geo_lat != null ? r.geo_lat : '', geo_lng: r.geo_lng != null ? r.geo_lng : '',
    geo_accuracy_m: r.geo_accuracy != null ? Math.round(r.geo_accuracy) : '',
    q1_response_time: r.q1_response_time, q2_technical_skill: r.q2_technical_skill,
    q3_communication_cost: r.q3_communication_cost, q4_professionalism: r.q4_professionalism,
    q5_overall: r.q5_overall, comment: r.comment || '',
  }));
  const summary = agg().sort((a,b) => b.avg - a.avg).map((e,i) => ({
    rank: i + 1, engineer: e.name, department: e.dept, responses: e.n,
    avg_q1:+(e.q[0]/e.n).toFixed(2), avg_q2:+(e.q[1]/e.n).toFixed(2), avg_q3:+(e.q[2]/e.n).toFixed(2),
    avg_q4:+(e.q[3]/e.n).toFixed(2), avg_q5:+(e.q[4]/e.n).toFixed(2), avg_overall:+e.avg.toFixed(2),
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'ranking');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detail), 'detail');
  const d = new Date(), p = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `survey_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`);
}

boot();
