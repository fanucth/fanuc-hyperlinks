<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>FTH Survey Dashboard</title>
<!-- FTH Service Quality & CS Evaluation — Exec Dashboard
     VERSION: ดู APP_VERSION ในสคริปต์ (มุมขวาล่าง + console) — bump ทุกครั้งก่อนอัปขึ้น GitHub
     ผู้บริหารเท่านั้น (อีเมลใน EXEC_ALLOWLIST + ตาราง exec_allowlist / RLS is_exec())
     ข้อมูลจาก view v_survey_full (ดู SUPABASE_SETUP.sql)

     CHANGELOG:
       2026.09.09a - เวอร์ชันแรก: login exec, filter วันที่/ช่าง, สรุปรายช่าง, ตารางรายการ, export Excel (2 sheet)
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f1420; --card:#171e2e; --card2:#1e2740; --accent:#ffb400; --accent2:#ff5a3c;
    --text:#eef1f7; --sub:#9aa4bd; --ok:#3ddc84; --line:#2a3350;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Tahoma,'Noto Sans Thai','Noto Sans JP',Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:16px 18px 10px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 82%,transparent);z-index:5;}
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;max-width:1000px;margin:0 auto;}
  header h1{font-size:17px;margin:0 0 2px;}
  header p{margin:0;color:var(--sub);font-size:12px;}
  .header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .lang-select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;}
  .btn-logout{background:var(--card2);color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;}
  main{max-width:1000px;margin:0 auto;padding:8px 14px 90px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--accent);letter-spacing:.3px;}
  label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
  input[type=email],input[type=password],input[type=date],select{
    width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;margin-bottom:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:10px;border:none;font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:8px;}
  .btn-primary{background:var(--accent);color:#1a1500;}
  .btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .hidden{display:none!important;}
  .banner{background:rgba(255,90,60,.12);border:1px solid var(--accent2);color:#ffd9d1;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.5;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .filters>div{flex:1;min-width:150px;}
  .filters .acts{display:flex;gap:8px;flex:0 0 auto;min-width:0;}
  .filters .acts .btn{width:auto;padding:11px 16px;margin:0;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap;}
  th{color:var(--sub);font-weight:600;font-size:10.5px;text-transform:uppercase;}
  td.wrap{white-space:normal;word-break:break-word;max-width:260px;}
  .num{text-align:center;}
  .scrollx{overflow-x:auto;}
  .muted{color:var(--sub);font-size:12px;text-align:center;padding:16px 0;}
  .sumline{color:var(--sub);font-size:12.5px;margin-bottom:10px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:#062f18;padding:10px 18px;border-radius:30px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:92%;text-align:center;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--accent2);color:#fff;}
  a.sig{color:var(--accent);text-decoration:none;}
  #appVer{position:fixed;right:6px;bottom:4px;font-size:11px;color:var(--sub);opacity:.55;pointer-events:none;user-select:none;z-index:5;}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1 data-i18n="appTitle">FANUC Thai — Survey Dashboard</h1>
      <p data-i18n="appSub">ผลสำรวจความพึงพอใจลูกค้า — สำหรับผู้บริหาร</p>
    </div>
    <div class="header-actions">
      <select id="langSelect" class="lang-select" title="Language">
        <option value="th">ไทย</option><option value="en">EN</option><option value="ja">日本語</option>
      </select>
      <button id="btnLogout" class="btn-logout hidden" data-i18n="logout">ออกจากระบบ</button>
    </div>
  </div>
</header>

<main>
  <div id="cfgBanner" class="banner hidden"></div>

  <!-- LOGIN -->
  <section id="viewLogin" class="hidden">
    <div class="card" style="max-width:380px;margin:24px auto;">
      <h2 data-i18n="signIn">เข้าสู่ระบบ</h2>
      <label data-i18n="email">อีเมล</label>
      <input type="email" id="loginEmail" autocomplete="username">
      <label data-i18n="password">รหัสผ่าน</label>
      <input type="password" id="loginPass" autocomplete="current-password">
      <button class="btn btn-primary" id="btnLogin" data-i18n="signIn">เข้าสู่ระบบ</button>
      <p class="muted" data-i18n="execOnly">เฉพาะผู้บริหารที่ได้รับสิทธิ์เท่านั้น</p>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="viewDash" class="hidden">
    <div class="card">
      <h2 data-i18n="filters">ตัวกรอง</h2>
      <div class="filters">
        <div><label data-i18n="dateFrom">ตั้งแต่วันที่</label><input type="date" id="fFrom"></div>
        <div><label data-i18n="dateTo">ถึงวันที่</label><input type="date" id="fTo"></div>
        <div><label data-i18n="filterEngineer">วิศวกร</label>
          <select id="fEngineer"><option value="">— ทั้งหมด —</option></select></div>
        <div class="acts">
          <button class="btn btn-primary" id="btnApply" data-i18n="apply">แสดงผล</button>
          <button class="btn btn-secondary" id="btnExport" data-i18n="exportXlsx">Export Excel</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="byEngineer">สรุปรายช่าง</h2>
      <div id="sumLine" class="sumline"></div>
      <div class="scrollx"><table id="sumTable"></table></div>
    </div>

    <div class="card">
      <h2 data-i18n="detail">รายการทั้งหมด</h2>
      <div class="scrollx"><table id="detTable"></table></div>
    </div>
  </section>
</main>

<div id="appVer"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------- CONFIG ---------- */
const APP_VERSION = "2026.09.09a";
const SUPABASE_CONFIG = {
  url: "https://soupmzzqsrwfnqmxevlg.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvdXBtenpxc3J3Zm5xbXhldmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTg1NTgsImV4cCI6MjEwMzk5NDU1OH0.4WRRr_5qN4CLx6Ip85kzStKkZmTtxAUDr2K4YjWCNs0"
};
// ต้องตรงกับตาราง exec_allowlist ใน DB (ตัวพิมพ์เล็ก)
const EXEC_ALLOWLIST = [
  "ito.masayuki@fth.fanuc.com",
  "masada.ryota@fth.fanuc.com",
  "yamamoto.katsuhiko@fth.fanuc.com",
  "oshikubo.takayuki@fth.fanuc.com",
  "weerachai.j@fth.fanuc.com",
];

/* ---------- i18n ---------- */
const I18N = {
  appTitle:{th:"FANUC Thai — แดชบอร์ดผลสำรวจ",en:"FANUC Thai — Survey Dashboard",ja:"FANUC Thai — アンケート集計"},
  appSub:{th:"ผลสำรวจความพึงพอใจลูกค้า — สำหรับผู้บริหาร",en:"Customer satisfaction results — management view",ja:"顧客満足度の結果 — 管理者用"},
  signIn:{th:"เข้าสู่ระบบ",en:"Sign in",ja:"ログイン"},
  email:{th:"อีเมล",en:"Email",ja:"メール"},
  password:{th:"รหัสผ่าน",en:"Password",ja:"パスワード"},
  logout:{th:"ออกจากระบบ",en:"Sign out",ja:"ログアウト"},
  execOnly:{th:"เฉพาะผู้บริหารที่ได้รับสิทธิ์เท่านั้น",en:"Authorised management accounts only",ja:"許可された管理者のみ"},
  notExec:{th:"บัญชีนี้ไม่มีสิทธิ์ดูแดชบอร์ด",en:"This account is not allowed to view the dashboard",ja:"このアカウントには閲覧権限がありません"},
  loginFail:{th:"เข้าสู่ระบบไม่สำเร็จ: {err}",en:"Sign-in failed: {err}",ja:"ログイン失敗: {err}"},
  filters:{th:"ตัวกรอง",en:"Filters",ja:"フィルター"},
  dateFrom:{th:"ตั้งแต่วันที่",en:"From",ja:"開始日"},
  dateTo:{th:"ถึงวันที่",en:"To",ja:"終了日"},
  filterEngineer:{th:"วิศวกร",en:"Engineer",ja:"エンジニア"},
  allEngineers:{th:"— ทั้งหมด —",en:"— All —",ja:"— すべて —"},
  apply:{th:"แสดงผล",en:"Apply",ja:"表示"},
  exportXlsx:{th:"Export Excel",en:"Export Excel",ja:"Excel出力"},
  byEngineer:{th:"สรุปรายช่าง",en:"By engineer",ja:"エンジニア別集計"},
  detail:{th:"รายการทั้งหมด",en:"All responses",ja:"全回答"},
  noResults:{th:"ไม่มีข้อมูลในช่วงที่เลือก",en:"No results for this range",ja:"該当データなし"},
  sumLine:{th:"ทั้งหมด {n} รายการ · คะแนนเฉลี่ยรวม {avg}",en:"{n} responses · overall average {avg}",ja:"{n}件 · 総合平均 {avg}"},
  colEngineer:{th:"วิศวกร",en:"Engineer",ja:"エンジニア"},
  colDept:{th:"แผนก",en:"Dept",ja:"部署"},
  colCount:{th:"จำนวน",en:"Responses",ja:"件数"},
  colAvg:{th:"เฉลี่ย",en:"Avg",ja:"平均"},
  colDate:{th:"วันที่ตอบ",en:"Submitted",ja:"回答日時"},
  colReport:{th:"Service Report No.",en:"Service Report No.",ja:"レポート番号"},
  colOrder:{th:"Service Order No.",en:"Service Order No.",ja:"オーダー番号"},
  colComment:{th:"ข้อเสนอแนะ",en:"Comment",ja:"コメント"},
  colSig:{th:"ลายเซ็น",en:"Sig",ja:"署名"},
  q1:{th:"ตอบสนอง",en:"Response",ja:"対応速度"},
  q2:{th:"ทักษะ",en:"Skill",ja:"技術力"},
  q3:{th:"สื่อสาร/ค่าใช้จ่าย",en:"Comm/Cost",ja:"説明/費用"},
  q4:{th:"มืออาชีพ",en:"Professional",ja:"プロ意識"},
  q5:{th:"ภาพรวม",en:"Overall",ja:"総合"},
};
let lang = localStorage.getItem('dashLang') || 'th';
function t(key, vars){
  let s = (I18N[key] && (I18N[key][lang] || I18N[key].th)) || key;
  if (vars) for (const k in vars) s = s.replace(`{${k}}`, vars[k]);
  return s;
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.documentElement.lang = lang;
}

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateTime(iso){
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let toastTimer;
function toast(msg, err){
  const el = $('toast'); el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'toast', 3200);
}
function show(id){ ['viewLogin','viewDash'].forEach(v => $(v).classList.toggle('hidden', v !== id)); }

/* ---------- boot ---------- */
const CONFIGURED = !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);
const sb = CONFIGURED ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey) : null;

async function boot(){
  $('appVer').textContent = 'v' + APP_VERSION;
  console.log('%cFTH Survey Dashboard ' + APP_VERSION, 'font-weight:bold');
  $('langSelect').value = lang;
  applyI18n();
  $('langSelect').onchange = e => {
    lang = e.target.value; localStorage.setItem('dashLang', lang);
    applyI18n();
    if (!$('viewDash').classList.contains('hidden')) applyFilter();
  };
  $('btnLogout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

  if (!CONFIGURED) { $('cfgBanner').textContent = 'Supabase config missing'; $('cfgBanner').classList.remove('hidden'); show('viewLogin'); return; }

  const { data:{ session } } = await sb.auth.getSession();
  if (session && isExecEmail(session.user.email)) return startDash();
  if (session) await sb.auth.signOut();
  show('viewLogin');
  wireLogin();
}

function isExecEmail(email){
  return EXEC_ALLOWLIST.includes((email || '').toLowerCase());
}

function wireLogin(){
  $('btnLogin').onclick = async () => {
    const email = $('loginEmail').value.trim().toLowerCase();
    const password = $('loginPass').value;
    if (!email || !password) return;
    $('btnLogin').disabled = true;
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      if (!isExecEmail(data.user.email)) {
        await sb.auth.signOut();
        return toast(t('notExec'), true);
      }
      show('viewDash');
      startDash();
    } catch (e) {
      toast(t('loginFail', { err: e.message || e }), true);
    } finally {
      $('btnLogin').disabled = false;
    }
  };
}

/* ---------- dashboard ---------- */
let rows = [];

async function startDash(){
  show('viewDash');
  $('btnLogout').classList.remove('hidden');
  $('fEngineer').options[0].text = t('allEngineers');
  const { data: engs } = await sb.from('engineers').select('id,fname,lname').order('fname');
  (engs || []).forEach(e => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = `${e.fname} ${e.lname}`;
    $('fEngineer').appendChild(o);
  });
  $('btnApply').onclick = applyFilter;
  $('btnExport').onclick = exportXlsx;
  applyFilter();
}

function qsum(r){ return r.q1_response_time + r.q2_technical_skill + r.q3_communication_cost + r.q4_professionalism + r.q5_overall; }

async function applyFilter(){
  const from = $('fFrom').value ? new Date($('fFrom').value + 'T00:00:00').toISOString() : null;
  const to   = $('fTo').value   ? new Date($('fTo').value   + 'T23:59:59').toISOString() : null;
  const engId = $('fEngineer').value;

  let q = sb.from('v_survey_full').select('*').order('submitted_at', { ascending:false });
  if (from) q = q.gte('submitted_at', from);
  if (to)   q = q.lte('submitted_at', to);
  if (engId) q = q.eq('engineer_id', engId);

  const { data, error } = await q;
  if (error) { $('sumLine').textContent = error.message; $('sumTable').innerHTML = ''; $('detTable').innerHTML = ''; return; }
  rows = data || [];
  renderSummary();
  renderDetail();
}

function renderSummary(){
  const sumT = $('sumTable');
  if (!rows.length) { $('sumLine').textContent = t('noResults'); sumT.innerHTML = ''; return; }

  const overall = rows.reduce((s,r) => s + qsum(r)/5, 0) / rows.length;
  $('sumLine').textContent = t('sumLine', { n: rows.length, avg: overall.toFixed(2) });

  const g = {};
  rows.forEach(r => {
    const k = r.engineer_id;
    (g[k] = g[k] || { name:`${r.fname||''} ${r.lname||''}`.trim(), dept:r.department||'', n:0, q:[0,0,0,0,0] });
    g[k].n++;
    g[k].q[0]+=r.q1_response_time; g[k].q[1]+=r.q2_technical_skill; g[k].q[2]+=r.q3_communication_cost;
    g[k].q[3]+=r.q4_professionalism; g[k].q[4]+=r.q5_overall;
  });
  const list = Object.values(g).sort((a,b) => (b.q[4]/b.n) - (a.q[4]/a.n));
  const cell = v => `<td class="num">${v.toFixed(2)}</td>`;
  sumT.innerHTML = `
    <thead><tr>
      <th>${t('colEngineer')}</th><th>${t('colDept')}</th><th class="num">${t('colCount')}</th>
      <th class="num">${t('q1')}</th><th class="num">${t('q2')}</th><th class="num">${t('q3')}</th>
      <th class="num">${t('q4')}</th><th class="num">${t('q5')}</th><th class="num">${t('colAvg')}</th>
    </tr></thead>
    <tbody>${list.map(e => `
      <tr>
        <td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td class="num">${e.n}</td>
        ${cell(e.q[0]/e.n)}${cell(e.q[1]/e.n)}${cell(e.q[2]/e.n)}${cell(e.q[3]/e.n)}${cell(e.q[4]/e.n)}
        <td class="num"><b>${(e.q.reduce((s,x)=>s+x,0)/5/e.n).toFixed(2)}</b></td>
      </tr>`).join('')}</tbody>`;
}

function renderDetail(){
  const detT = $('detTable');
  if (!rows.length) { detT.innerHTML = ''; return; }
  detT.innerHTML = `
    <thead><tr>
      <th>#</th><th>${t('colDate')}</th><th>${t('colEngineer')}</th>
      <th>${t('colReport')}</th><th>${t('colOrder')}</th>
      <th class="num">${t('q1')}</th><th class="num">${t('q2')}</th><th class="num">${t('q3')}</th>
      <th class="num">${t('q4')}</th><th class="num">${t('q5')}</th>
      <th>${t('colComment')}</th><th>${t('colSig')}</th>
    </tr></thead>
    <tbody>${rows.map((r,i) => `
      <tr>
        <td>${i+1}</td>
        <td>${fmtDateTime(r.submitted_at)}</td>
        <td>${esc(`${r.fname||''} ${r.lname||''}`.trim())}</td>
        <td>${esc(r.service_report_no||'')}</td>
        <td>${esc(r.service_order_no||'')}</td>
        <td class="num">${r.q1_response_time}</td><td class="num">${r.q2_technical_skill}</td><td class="num">${r.q3_communication_cost}</td>
        <td class="num">${r.q4_professionalism}</td><td class="num">${r.q5_overall}</td>
        <td class="wrap" title="${esc(r.comment||'')}">${esc(r.comment||'')}</td>
        <td><a href="#" class="sig" data-sig="${esc(r.signature_path||'')}">👁</a></td>
      </tr>`).join('')}</tbody>`;

  detT.querySelectorAll('a[data-sig]').forEach(a => {
    a.onclick = async ev => {
      ev.preventDefault();
      const p = a.dataset.sig;
      if (!p) return;
      const { data, error } = await sb.storage.from('survey-signatures').createSignedUrl(p, 3600);
      if (error) return toast(error.message, true);
      window.open(data.signedUrl, '_blank');
    };
  });
}

function exportXlsx(){
  if (!rows.length) return toast(t('noResults'), true);

  const detail = rows.map(r => ({
    submitted_at: fmtDateTime(r.submitted_at),
    engineer: `${r.fname||''} ${r.lname||''}`.trim(),
    department: r.department || '',
    title: r.title || '',
    tel: r.tel || '',
    service_report_no: r.service_report_no || '',
    service_order_no: r.service_order_no || '',
    q1_response_time: r.q1_response_time,
    q2_technical_skill: r.q2_technical_skill,
    q3_communication_cost: r.q3_communication_cost,
    q4_professionalism: r.q4_professionalism,
    q5_overall: r.q5_overall,
    comment: r.comment || '',
  }));

  const g = {};
  rows.forEach(r => {
    const k = r.engineer_id;
    (g[k] = g[k] || { engineer:`${r.fname||''} ${r.lname||''}`.trim(), department:r.department||'', n:0, s:[0,0,0,0,0] });
    g[k].n++;
    g[k].s[0]+=r.q1_response_time; g[k].s[1]+=r.q2_technical_skill; g[k].s[2]+=r.q3_communication_cost;
    g[k].s[3]+=r.q4_professionalism; g[k].s[4]+=r.q5_overall;
  });
  const summary = Object.values(g).map(e => ({
    engineer: e.engineer, department: e.department, responses: e.n,
    avg_q1:+(e.s[0]/e.n).toFixed(2), avg_q2:+(e.s[1]/e.n).toFixed(2), avg_q3:+(e.s[2]/e.n).toFixed(2),
    avg_q4:+(e.s[3]/e.n).toFixed(2), avg_q5:+(e.s[4]/e.n).toFixed(2),
    avg_overall:+(e.s.reduce((x,y)=>x+y,0)/5/e.n).toFixed(2),
  })).sort((a,b) => b.avg_overall - a.avg_overall);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'summary');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detail), 'detail');
  const d = new Date(), p = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `survey_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`);
}

boot();
</script>
